apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      priorityClassName: system-node-critical
      containers:
      - image: nvcr.io/nvidia/k8s-device-plugin:v0.14.1
        name: nvidia-device-plugin-ctr
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        # --- BỔ SUNG QUAN TRỌNG: Thêm argument để chỉ định file config ---
        args:
          - -config-file=/etc/nvidia/config.yaml
        # -----------------------------------------------------------------
        volumeMounts:
          - name: device-plugin
            mountPath: /var/lib/kubelet/device-plugins
          # --- BỔ SUNG QUAN TRỌNG: Mount file config vào container ---
          - name: nvidia-config
            mountPath: /etc/nvidia
          # -------------------------------------------------------------
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: nvidia-config
          configMap:
            name: nvidia-device-plugin-config
        # ----------------------------------------------------------