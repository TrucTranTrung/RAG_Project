global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - "alertmanager:9093"

scrape_configs:
  - job_name: 'nvidia-dcgm'
    scrape_interval: 5s
    static_configs:
      - targets: ['dcgm-exporter:9400']
  
  - job_name: 'node-exporter'
    scrape_interval: 5s
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    scrape_interval: 5s
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "tts-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["tts-api:8001"]  
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: "whisper-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["whisper-api:8000"]  
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
