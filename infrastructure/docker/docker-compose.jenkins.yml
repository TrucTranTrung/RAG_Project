services:
  jenkins:
    build:
        context: ./Container_Folder/jenkin_upgrade
        dockerfile: dockerfile
    image: tructran172003/jenkin:v1.0
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - ./jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:

networks:
  my-network:
    driver: bridge

