services:
  jenkins:
    build:
      context: ../../src/services/jenkin_upgrade
      dockerfile: dockerfile
    image: tructran172003/jenkin:v1.0
    container_name: jenkins
    privileged: true
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - ./jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - NO_PROXY=localhost,127.0.0.1,updates.jenkins.io

