# Namespace: Để cô lập các tài nguyên của ứng dụng
apiVersion: v1
kind: Namespace
metadata:
  name: rag-app

---
# Database (PostgreSQL)
# Service để cung cấp một địa chỉ IP/DNS ổn định cho database
apiVersion: v1
kind: Service
metadata:
  name: db-service
  namespace: rag-app
spec:
  selector:
    app: db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP # Chỉ có thể truy cập bên trong cluster

---
# StatefulSet cho PostgreSQL
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: rag-app
spec:
  serviceName: "db-service"
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: pgvector
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          # Lấy biến môi trường từ Secret đã tạo
          envFrom:
            - secretRef:
                name: rag-app-secrets
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  # Định nghĩa template cho PersistentVolumeClaim
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

---
# AI Server (Pod chứa cả 3 model)
# Deployment này sẽ tạo ra một Pod duy nhất chứa 3 container AI.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-server-deployment
  namespace: rag-app
spec:
  type: NodePort
  selector:
    matchLabels:
      app: ai-server
  template:
    metadata:
      labels:
        app: ai-server
    spec:
      # Đây là danh sách các container sẽ chạy bên trong cùng một Pod
      containers:
      # Container cho Whisper API
      - name: whisper-api-container
        image: tructran172003/whisper-api:v1.0
        ports:
        - containerPort: 8000
        # Chỉ cần một container yêu cầu GPU là đủ cho cả Pod
        resources:
          limits:
            nvidia.com/gpu: 1

      # Container cho TTS API
      - name: tts-api-container
        image: tructran172003/tts-api:v1.0
        ports:
        - containerPort: 8001

      # Container cho Chatbot API
      - name: chatbot-api-container
        image: tructran172003/chatbot-api:v1.0
        ports:
        - containerPort: 4096
        # secret vào container này
        envFrom:
        - secretRef:
            name: rag-app-secrets

---
# Service cho AI Server
# Service này sẽ trỏ đến Pod và mở cả 3 cổng
apiVersion: v1
kind: Service
metadata:
  name: ai-server-service
  namespace: rag-app
spec:
  selector:
    app: ai-server
  type: NodePort # Dùng NodePort để có thể test từ bên ngoài
  ports:
    - name: whisper
      protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30000
    - name: tts
      protocol: TCP
      port: 8001
      targetPort: 8001
      nodePort: 30001
    - name: chatbot
      protocol: TCP
      port: 4096
      targetPort: 4096
      nodePort: 30002 
---
# Jenkins
# PersistentVolumeClaim để lưu trữ dữ liệu của Jenkins
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-pvc
  namespace: rag-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---
apiVersion: v1
kind: Service
metadata:
  name: jenkins-service
  namespace: rag-app
spec:
  type: NodePort # Hoặc LoadBalancer
  selector:
    app: jenkins
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: jnlp
      port: 50000
      targetPort: 50000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: rag-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      containers:
        - name: jenkins
          image: tructran172003/jenkin:v1.0
          ports:
            - containerPort: 8080
            - containerPort: 50000
          # securityContext:
          #   privileged: true
          #   runAsUser: 0 # Chạy với quyền root
          volumeMounts:
            # Mount volume để lưu dữ liệu Jenkins
            - name: jenkins-data
              mountPath: /var/jenkins_home
            # Mount Docker socket từ node host
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: jenkins-data
          persistentVolumeClaim:
            claimName: jenkins-pvc
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
